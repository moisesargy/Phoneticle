  </defs>
  <!-- cloth body: wavy top, torn zigzag bottom/right edges -->
  <path d="M18 34 C45 20 70 46 100 34 C130 22 160 44 196 28 L202 52 L194 64 L204 80 L194 94 L200 112 L186 124 L170 114 L156 128 L140 116 L124 130 L108 116 L92 128 L76 114 L58 126 L42 112 L28 120 L20 100 L26 84 L16 68 L24 52 Z"
